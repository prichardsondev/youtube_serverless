<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="index.css" />
    <title>Playlist Builder</title>
  </head>
  <body>
    <main class="main-container">
      <h1>AWS Playlist Builder</h1><p>Save songs and build a playlist by genre and rating. Use the same case for usernames and genres each time.</p><p id="status" role="status" aria-live="polite"></p><p><a id="playlist-link" hidden target="_blank" rel="noopener noreferrer">Open playlist on YouTube</a></p>

      <section class="card">
        <h2>Create User</h2>
        <form id="userdata" class="form" onsubmit="event.preventDefault(); addUser()">
          <label>Full Name<input type="text" name="name" placeholder="Full Name" required /></label>
          <label>Username<input type="text" name="username" placeholder="Username" required /></label>
          <label>Email<input type="email" name="email" placeholder="Email" required /></label>
          <button type="submit">Submit</button>
        </form>
      </section>

      <section class="card">
        <h2>Add Song</h2>
        <form id="songdata" class="form" onsubmit="event.preventDefault(); addSong()">
          <label>Username<input type="text" name="user" placeholder="Username" required /></label>
          <label>Song ID<input type="text" name="songid" placeholder="Song ID" required /></label>
          <label>Genre<input type="text" name="genre" placeholder="Genre" required /></label>
          <label>Stars (1–5)<input type="number" min="1" max="5" step="1" name="stars" placeholder="Stars (1–5)" required /></label>
          <button type="submit">Submit</button>
        </form>
      </section>

      <section class="card">
        <h2>Get Playlist</h2>
        <form id="playlistdata" class="form" onsubmit="event.preventDefault(); getPlaylist()">
          <label>Username<input type="text" name="user" placeholder="Username" required /></label>
          <label>Genre<input type="text" name="genre" placeholder="Genre" required /></label>
          <label>Stars (1–5)<input type="number" min="1" max="5" step="1" name="stars" placeholder="Stars (1–5)" required /></label>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
