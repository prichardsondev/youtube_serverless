<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="index.css" />
    <title>🎵 Playlist Builder</title>
  </head>
  <body>
    <main class="main-container">
      <h1>🎧 AWS Playlist Builder</h1>

      <section class="card">
        <h2>Create User</h2>
        <form id="userdata" class="form">
          <input type="text" name="name" placeholder="Full Name" required />
          <input type="text" name="username" placeholder="Username" required />
          <input type="email" name="email" placeholder="Email" required />
          <button type="button" onclick="addUser()">Submit</button>
        </form>
      </section>

      <section class="card">
        <h2>Add Song</h2>
        <form id="songdata" class="form">
          <input type="text" name="user" placeholder="Username" required />
          <input type="text" name="songid" placeholder="Song ID" required />
          <input type="text" name="genre" placeholder="Genre" required />
          <input type="text" name="stars" placeholder="Stars (1–5)" required />
          <button type="button" onclick="addSong()">Submit</button>
        </form>
      </section>

      <section class="card">
        <h2>Get Playlist</h2>
        <form id="playlistdata" class="form">
          <input type="text" name="user" placeholder="Username" required />
          <input type="text" name="genre" placeholder="Genre" required />
          <input type="text" name="stars" placeholder="Stars (1–5)" required />
          <button type="button" onclick="getPlaylist()">Submit</button>
        </form>
      </section>
    </main>

    <script src="index.js"></script>
